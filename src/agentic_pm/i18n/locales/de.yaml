# Deutsch. Fällt Satz für Satz auf Englisch zurück, wenn etwas fehlt.
# Wie man eine Sprache ergänzt oder verbessert: docs/de/languages.md
meta:
  name: Deutsch
  review: native
  date: "EEE, dd.MM.y"  # z. B. Fr., 21.11.2026

register:
  informal:
    style: "Schreibe auf Deutsch. Duze die Person und schreibe die Anrede immer groß: Du, Dich, Dir, Dein, Deine. Niemals 'Sie'. Herzlich, ruhig und ermutigend, wie ein hilfsbereiter Teamkollege; kein Druck, keine Befehle."
    forbid: ["\\b(Sie|Ihnen|Ihr|Ihre|Ihren|Ihrem|Ihrer)\\b"]
    capitalize: ["du", "dich", "dir", "dein", "deine", "deinen", "deinem", "deiner", "deines"]
  formal:
    style: "Schreibe auf Deutsch. Sieze die Person (Sie, Ihnen, Ihr). Herzlich, ruhig und höflich, wie eine hilfsbereite Kollegin; kein Druck, keine Befehle."
    forbid: ["\\b([Dd]u|[Dd]ich|[Dd]ir|[Dd]ein|[Dd]eine|[Dd]einen|[Dd]einem|[Dd]einer|[Dd]eines)\\b"]

