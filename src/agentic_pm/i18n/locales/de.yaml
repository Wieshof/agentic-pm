texts:
  messages:
    approval_subject: '🙋 Dein OK gebraucht: {change_short} bei #{id} {title}'
    approval_body: 'Hallo {name},


      {actor} möchte bei #{id} {title} {change}.

      Grund: {reason}


      Dafür brauche ich Dein OK, weil {why_tier}.


      Hier kannst Du es Dir ansehen und entscheiden: {url}


      Der Link gilt bis {expires}. Ändert sich die Aufgabe vorher, frage ich einfach neu. Danke! 💬'
    why_high: es einen Kundentermin betrifft oder wer die Aufgabe verantwortet
    why_medium: es den Plan für Deine Aufgabe ändert
    pending_comment: '⏳ Vorschlag: {change}. Wartet auf die Bestätigung von {names}.'
    approved_comment: ✅ Freigegeben von {name}.
    declined_comment: '🙅 {name} hat sich dagegen entschieden: {change}. Nichts wurde geändert.'
    howto_subject: '🎉 #{id} ist erledigt. Wie hast Du es gelöst?'
    howto_body: 'Hallo {name},


      stark, dass #{id} {title} erledigt ist!


      Magst Du mit ein, zwei Sätzen antworten, wie Du es gelöst hast? Zum Beispiel: Was war die Ursache, und was hat geholfen?


      Ich mache daraus ein kurzes How-to im Ticket (auf {ticket_language}), damit die Nächsten es finden. Formatierung brauchst Du nicht, eine kurze Notiz reicht völlig.


      Danke! 🙏'
    howto_asked_comment: 📝 {names} um ein kurzes How-to gebeten.
    ack_howto: 'Danke, {name}! Ich habe es als How-to zu #{id} hinzugefügt: {url}'
    ack_note: 'Danke, {name}! Ich habe Deine Notiz zu #{id} hinzugefügt: {url}'
    ack_scope: Danke, {name}! Das klingt nach einer neuen Anforderung, deshalb habe ich es an {leads} weitergegeben, damit vor dem Start entschieden wird. Ich melde mich.
    ack_unknown_task: 'Hallo {name}, danke für Deine Nachricht! Ich konnte nicht erkennen, um welche Aufgabe es geht. Magst Du auf eine meiner Aufgaben-Mails antworten oder die Nummer nennen, z. B. #142?'
    scope_lead_subject: 💡 Möglicher neuer Umfang von {requester}
    scope_lead_body: 'Hallo {name},


      {requester} hat zu #{id} {title} geschrieben:


      > {quote}


      Das sieht nach neuem Umfang aus, deshalb habe ich dafür noch keine Arbeit angelegt. Formale Änderungsanträge mit Auswirkungsschätzung kommen bald (#50). Magst Du bis dahin entscheiden, wie es weitergeht?


      Danke! 💬'
    onboarding_subject: 👋 Hallo {name}, ich bin der Projekt-Assistent Deines Teams
    onboarding_body: "Hallo {name},\n\nich bin agent-pm, der Projekt-Assistent, den Dein Team für {project} eingerichtet hat. Ich helfe beim Kleinkram: Briefings, Erinnerungen, und aus \"so habe ich es gelöst\" ein How-to im Ticket machen.\n\nWas ich über Dich verwende:\n  • Deinen Namen, {channels} und Deine Sprache ({language}) aus der Team-Datei\n  • die Aufgaben, die Dir in {tracker} zugewiesen sind\n  • die Nachrichten, die Du mir schickst, damit ich sie der richtigen Aufgabe zuordnen kann\n\nWas ich nicht tue:\n  • keine Bewertungen, Ranglisten oder Produktivitätszahlen über Dich\n  • keine Historie über Dich; ich schaue nur auf die Aufgaben, wie sie gerade sind\n  • kein Erraten Deiner Stimmung aus Nachrichten\n  • Nachrichten verarbeitet ein Modell auf unseren eigenen Servern ({llm})\n\nDein Briefing: {brief}.\nMöchtest Du etwas ändern oder abschalten? Antworte einfach oder frag {leads}.\nDetails: {doc}\n\nSchön, Dich kennenzulernen! \U0001F64C"
    onboarding_no_brief: vorerst keins
    reply_subject: 'Re: #{id} {title}'
    chat_unknown_task: 'Hallo {name}, danke für Deine Nachricht! Um welche Aufgabe geht es? Antworte auf eine meiner Nachrichten oder nenn die Nummer, z. B. #142.'
    chat_encrypted: Hallo {name}, verschlüsselte Nachrichten kann ich leider noch nicht lesen. Magst Du mir in einem unverschlüsselten Direktchat schreiben?
    chat_voice_off: Danke für die Sprachnachricht, {name}! Sprachnachrichten kann ich hier noch nicht anhören. Magst Du es mir kurz schreiben?
    chat_voice_failed: Sorry {name}, die Sprachnachricht konnte ich nicht verstehen. Versuchst Du es noch einmal, oder schreibst Du es mir?
    confirm_due: 'Soll ich den Termin von #{id} {title} auf {date} setzen? Antworte einfach mit ja oder nein.'
    confirm_estimate: 'Soll ich die Schätzung von #{id} {title} auf {hours} setzen? Antworte einfach mit ja oder nein.'
    confirm_status_self: 'Du hast „{evidence}“ geschrieben, aber #{id} {title} steht in {tracker} noch auf {status}. Soll ich es auf {new} setzen? Antworte einfach mit ja oder nein.'
    confirm_status_owner: '{who} hat zu #{id} {title} „{evidence}“ geschrieben, aber in {tracker} steht es noch auf {status}. Soll ich es auf {new} setzen? Antworte einfach mit ja oder nein.'
    status_check_asked: 'Danke! In {tracker} steht #{id} noch auf {status}, deshalb habe ich {names} gebeten zu bestätigen, dass es {new} ist.'
    confirm_applied: 'Erledigt ✅ Ich habe #{id} aktualisiert: {change}.'
    confirm_pending: Danke! Dafür braucht es noch das OK von {names}, ich habe gefragt.
    confirm_declined: 'Alles klar, ich lasse #{id} so, wie es ist. 👍'
    confirm_stale: '#{id} hat sich inzwischen geändert, deshalb habe ich nichts geändert.'
    confirm_unverified: 'Hm, ich kann nicht bestätigen, dass die Frage von mir kam, deshalb habe ich #{id} so gelassen.'
    conflicts_heading: 🔍 Passt nicht ganz zusammen
    conflict_item: '{who} hat zu #{id} {title} „{evidence}“ geschrieben, aber es steht noch auf {status}. Soll es {new} sein?'
