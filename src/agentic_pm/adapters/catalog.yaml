    multi_assignee: true
    hierarchy: true
    events: webhook
    mcp: official
    verified: false
    notes_en: Extends the GitHub adapter with Status/Date/Estimate project fields
    notes_de: Erweitert den GitHub-Adapter um Status-/Datums-/Schätzungsfelder aus Projects
  asana:
