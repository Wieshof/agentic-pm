# Tracker catalog: the single source of truth for which trackers agentic-pm
# knows, what each one can offer, and how far support is.
#
# Used by: `agent-pm trackers`, team.yaml validation, and the generated support
# matrix in docs/trackers.md (+ docs/de/trackers.md). Edit here, then run
#   uv run agent-pm trackers --write-docs
#
# Values (from the trackers' public API docs, as of 2026-11; `verified: false`
# means not yet checked against a live instance, so treat the row as a plan):
#   dependencies: native | relation (via a configurable relation field) |
#                 convention ("Blocked by #12" in the description) | none
#   estimates / due_dates: native | field (custom field, needs mapping) | none
#   events: webhook | polling
#   status: available (adapter built) | planned | candidate (no issue yet)
#   tier: 1 = next, 2 = later, 3 = limited fit for team PM
#   mcp: official | community | none   (vendor/community MCP server exists)
#   notes_en / notes_de: one line, shown in the docs

trackers:
  github:
    name: GitHub Issues
    status: available
    tier: 1
    api: REST + GraphQL
    auth: Token / GitHub App
    dependencies: native
    estimates: field
    due_dates: field
    multi_assignee: true
    hierarchy: true
    events: webhook
    mcp: official
    verified: true
    notes_en: Due/estimate via body lines or milestone; Projects fields planned
    notes_de: Fälligkeit/Schätzung über Textzeilen oder Meilenstein; Projects-Felder geplant
  openproject:
    name: OpenProject
    status: available
    tier: 1
    api: REST v3 (HAL)
    auth: API key
    dependencies: native
    estimates: native
    due_dates: native
    multi_assignee: false
    hierarchy: true
    events: webhook
    mcp: community
    verified: false
    notes_en: Relations blocks/precedes/follows; tested with recorded responses
    notes_de: Beziehungen blocks/precedes/follows; mit aufgezeichneten Antworten getestet
  jira:
    name: Jira (Cloud / Data Center)
    status: planned
    issue: 25
    tier: 1
    api: REST v3 (Cloud), REST v2 (DC)
    auth: API token, OAuth 2.0; DC PAT
    dependencies: native
    estimates: native
    due_dates: native
    multi_assignee: false
    hierarchy: true
    events: webhook
    mcp: official
    verified: false
    notes_en: Issue links "blocks"; story points are a custom field; status categories
    notes_de: Issue-Links „blocks“; Story Points sind ein Custom Field; Status-Kategorien
  gitlab:
    name: GitLab Issues
    status: planned
    issue: 26
    tier: 1
    api: REST v4 + GraphQL
    auth: Token / OAuth
    dependencies: native
    estimates: native
    due_dates: native
    multi_assignee: true
    hierarchy: true
    events: webhook
    mcp: official
    verified: false
    notes_en: '"blocks" links and multiple assignees need Premium; status via scoped labels'
    notes_de: „blocks“-Links und mehrere Zuständige brauchen Premium; Status über Scoped Labels
  linear:
    name: Linear
    status: planned
    issue: 27
    tier: 1
    api: GraphQL
    auth: API key / OAuth
    dependencies: native
    estimates: native
    due_dates: native
    multi_assignee: false
    hierarchy: true
    events: webhook
    mcp: official
    verified: false
    notes_en: Clean fit; state types map directly
    notes_de: Passt sehr gut; Status-Typen lassen sich direkt abbilden
  plane:
    name: Plane
    status: planned
    issue: 28
    tier: 1
    api: REST v1
    auth: API key
    dependencies: native
    estimates: native
    due_dates: native
    multi_assignee: true
    hierarchy: true
    events: webhook
    mcp: official
    verified: false
    notes_en: Open source, self-hostable; check relation endpoints in the API version you run
    notes_de: Open Source, selbst hostbar; Beziehungs-Endpunkte in Deiner API-Version prüfen
  github_projects:
    name: GitHub Projects
    status: planned
    issue: 29
    tier: 1
    api: GraphQL (ProjectsV2)
