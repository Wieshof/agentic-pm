# Evaluation cases for the brief summary (issue #21).
# Each case: the facts the model sees, the language, and the task numbers the
# summary MUST mention (the most important ones). Graders also reject unknown
# task numbers, stray '#' tags, empty/too long output, formal "Sie" or
# lowercase Du-forms in German. `expect_summary: false` = quiet day, the model
# must not be called at all.

- id: overdue-and-risk-en
  language: en
  must_mention: ["#11"]
  facts:
    person: Sam
    today: "2026-11-13"
    overdue: [{id: "#11", title: Redis pool sizing, due: "2026-11-11"}]
    due_soon: [{id: "#12", title: Fix auth timeout, due: "2026-11-14"}]
    at_risk:
      - {id: "#12", title: Fix auth timeout, due: "2026-11-14", blocked_by: "#11", days_late: 1}
    others_waiting_on_you: [{waiting: "#13", on: "#12"}]
    team_risks: 0

