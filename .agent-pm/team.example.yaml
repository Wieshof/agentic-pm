# Example team preference file ("Drucker profiles").
# Copy to .agent-pm/team.yaml in the repository the agent manages.
# Each person controls their own entry; the agent can also update it on request.

project:
  tracker: github            # see `agent-pm trackers` for all 25 known trackers
  repo: your-org/your-repo
  timezone: Europe/Vienna
  leads: [alex]              # receive high-impact confirmation prompts
  ticket_language: en        # language the agent writes into tickets (how-to docs, comments)
  agent_accounts: [agent-pm-bot]  # tracker logins the agent writes with; their webhooks are ignored
  allow_writes: false        # opt-in (Phase 2): comments, how-tos, approved changes
  agent_email: pm@example.com     # replies about a task go to pm+<id>@example.com
  control_plane_url: https://pm.example.com  # approval links and webhook endpoint

# When the agent does what (`agent-pm run`). "08:30" = weekdays,
# "daily 08:30", "Fri 15:00", "last_friday 16:00". Times use project.timezone.
cadence:
  morning_triage: "08:30"    # personal briefs for everyone without their own brief.when
  end_of_day: "17:30"        # short note to leads, only if something needs them
  weekly_digest: "Fri 15:00" # week roll-up for leads

# No secrets in this file! It is committed to the repository. Tokens and
# passwords come from environment variables only (see README, "Secrets").

people:
  alex:
    name: Alex                  # how the agent greets you
    role: team-lead
    tracker_login: alex         # GitHub login / OpenProject display name, if different
    archetype: reader        # reader | writer | talker | listener
    channels:
      email: alex@example.com
    brief:
      when: "08:00"
      format: email
    interruptions: urgent-only

  sam:
    role: backend-engineer
    archetype: talker
    language: de                # Sam talks German with the agent; tickets stay in ticket_language
    channels:
      phone: "+43 000 000000"
      whatsapp: "+43 000 000000"
    check_in:
      window: "14:00-16:00"
      max_call_seconds: 90
    escalate_after_ignored: 3   # switch modality after N unanswered nudges

  kim:
    role: product-owner
    archetype: listener
    channels:
      phone: "+43 000 000001"
      email: kim@example.com
    brief:
      when: "Mon 09:00"
      format: voice             # spoken briefing with Q&A
    quiet_hours: "18:00-08:00"

# Model access (ADR-0001: local-first). Any OpenAI-compatible server works:
# Ollama, vLLM, llama.cpp server, LM Studio.
llm:
  provider: openai-compatible
  model: "llama3.1:8b"
  base_url: "http://localhost:11434/v1"
  # reasoning_effort: none        # for thinking models (qwen3.x etc.) on short JSON calls
