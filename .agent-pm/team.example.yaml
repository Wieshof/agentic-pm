# Example team preference file: how each person likes to hear from the agent.
# Copy to .agent-pm/team.yaml in the repository the agent manages.
# Each person controls their own entry; the agent can also update it on request.

project:
  tracker: github            # see `agent-pm trackers` for all 25 known trackers
  repo: your-org/your-repo
  timezone: Europe/Vienna
  leads: [alex]              # receive high-impact confirmation prompts
  ticket_language: en        # language the agent writes into tickets (how-to docs, comments)
  formality: informal        # informal (Du, tu) | formal (Sie, vous); see docs/languages.md
  agent_accounts: [agent-pm-bot]  # tracker logins the agent writes with; their webhooks are ignored
  allow_writes: false        # opt-in (Phase 2): comments, how-tos, approved changes
  agent_email: pm@example.com     # replies about a task go to pm+<id>@example.com
  control_plane_url: https://pm.example.com  # approval links and webhook endpoint

# Several trackers (clients, departments)? Replace project.tracker / project.repo
# with sources: and keep the team-wide settings above (docs/sources.md):
# sources:
#   eng: {tracker: github, project: acme/app, isolation: open}
#   ops: {tracker: openproject, project: launch-q1, base_url: "https://op.acme.de",
#         ticket_language: de, isolation: open}
#   client-a: {tracker: github, project: client-a/site}   # isolation: strict (default)

# When the agent does what (`agent-pm run`). "08:30" = weekdays,
# "daily 08:30", "Fri 15:00", "last_friday 16:00". Times use project.timezone.
cadence:
  morning_triage: "08:30"    # personal briefs for everyone without their own brief.when
  end_of_day: "17:30"        # short note to leads, only if something needs them
  weekly_digest: "Fri 15:00" # week roll-up for leads

# Data completeness: one friendly question per gap in the briefs (docs/data-quality.md)
completeness:
  require_estimate: false    # turn on if your team estimates
  triage: [alex]             # who gets tasks nobody owns (default: leads)

# No secrets in this file! It is committed to the repository. Tokens and
# passwords come from environment variables only (see README, "Secrets").

people:
  alex:
    name: Alex                  # how the agent greets you
    role: team-lead
    tracker_login: alex         # GitHub login / OpenProject display name, if different
    archetype: reader        # reader | writer | talker | listener
    channels:
      email: alex@example.com
    brief:
      when: "08:00"
      format: email
    interruptions: urgent-only

  sam:
    role: backend-engineer
    archetype: talker
    language: de                # Sam talks German with the agent; tickets stay in ticket_language
    channels:
      phone: "+43 000 000000"
      whatsapp: "+43 000 000000"
      signal: "+43 000 000000"  # Phase 3: chat with the agent on Signal (or matrix: "@sam:example.org")
    brief:
      when: "09:00"
      format: chat              # short brief in chat, then one question per missing detail
    check_in:
      window: "14:00-16:00"
      max_call_seconds: 90
    escalate_after_ignored: 3   # after N unanswered nudges for one question, try the next channel

  kim:
    role: product-owner
    archetype: listener
    channels:
      phone: "+43 000 000001"
      email: kim@example.com
    brief:
      when: "Mon 09:00"
      format: voice             # spoken briefing with Q&A
    quiet_hours: "18:00-08:00"

# Voice notes in chat are transcribed locally; audio and text stay in memory (docs/chat.md).
speech:
  engine: none                  # faster-whisper (uv sync --extra voice) | whisper-cpp
  # model: small                # faster-whisper model size
  # url: http://localhost:8080/inference   # whisper.cpp server

# Model access (ADR-0001: local-first). Any OpenAI-compatible server works:
# Ollama, vLLM, llama.cpp server, LM Studio.
llm:
  provider: openai-compatible
  model: "gemma4"               # or "qwen3.5" with reasoning_effort: none (docs/getting-started.md)
  base_url: "http://localhost:11434/v1"
  # reasoning_effort: none        # for thinking models (qwen3.x etc.) on short JSON calls
